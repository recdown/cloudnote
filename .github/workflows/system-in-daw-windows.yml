name: SYSTEM IN / DAW OUT - Windows x64 build

on:
  push:
    branches: [system-in-daw]
    paths:
      - "system-in-daw/**"
      - ".github/workflows/system-in-daw-windows.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S system-in-daw -B build -A x64
      - name: Build Release
        run: cmake --build build --config Release --parallel
      - name: Run unit tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Show built VST3 bundles
        shell: pwsh
        run: Get-ChildItem build -Recurse -Directory -Filter *.vst3 | Select-Object -ExpandProperty FullName
      - name: Upload SYSTEM IN development build
        uses: actions/upload-artifact@v4
        with:
          name: SystemIn-Development-windows-x64
          path: |
            build/**/*.vst3
            build/Release/SystemInService.exe
          if-no-files-found: error
          retention-days: 14
